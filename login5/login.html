<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
   <main> 
      <h1>login</h1>
      <form id="form">
         <label for="usuario">usuario:</label>
         <input type="text" id="usuario">
         <br><br>
         <label for="senha">senha:</label>
         <input type="password" id="senha">
         <br>
         <button type="button" id="botao-entrar">entrar</button>
         </form>
 <P id="mensagem"></P>
 <p id="porcentagem">0%</p>
     <script> 
      const botao = document.querySelector("#botao-entrar")
      botao.addEventListener("click", async function () {
       const usuario = document.querySelector("#usuario").value;
      const senha = document.querySelector("#senha").value;
      const mensagem = document.querySelector("#mensagem");
      const porcentagem = document.querySelector("#porcentagem");
       const usuarios =[
         {usuario:"jonas", senha:"123"},
         {usuario:"maria", senha:"456"},
         { usuario:"joao", senha:"789"}
       ];
     
              let encontrado = false;
              for (let i = 0; i < usuarios.length; i++) {
               if (usuario === usuarios [i].usuario && 
               senha === usuarios [i]. senha) {
              encontrado = true;
              break;
               }
            }
             if (encontrado) {
                    let progresso = 0;
                
                        while (progresso < 100) {
                            progresso = progresso + 1;
                            porcentagem.textContent = progresso + "%";
                            await new Promise (resolve => setTimeout(resolve,50));
                        }
                    window.location.href = "usuario.html";
                }else if (usuario === "") {
                    mensagem.textContent =
                        "Campo usuario nao pode ficar vazio!";
                } else if (senha === "") {
                    mensagem.textContent =
                        "Campo senha nao pode ficar vazio!";
                } else {
                    mensagem.textContent =
                        "Usuário ou senha incorretos!";
                }
            });
         7000410
             
        </script>
     </main>

<p> todos os direios reservados </p>

</body>
